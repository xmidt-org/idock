---
services:
  nginx:
    image: docker.io/library/nginx
    ports:
      - "7999:80"
  dynamodb:
    hostname: dynamodb.local.amazonaws.com
    image: docker.io/amazon/dynamodb-local
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports:
      - "7998:8000"
  kinesis:
    hostname: kinesis
    image: docker.io/saidsef/aws-kinesis-local
    ports:
      - "7997:4567"
version: "3.8"
